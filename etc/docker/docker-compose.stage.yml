services:

  vnext-app:
    container_name: vnext-app
    build:
      context: ../..
      dockerfile: orchestration/BBT.Workflow.Orchestration.HttpApi.Host/Dockerfile
      args:
        ENVIRONMENT: stage
    env_file:
      - .env.orchestration.stage
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 10s
      retries: 5
      start_period: 35s
      timeout: 30s
    ports:
      - "4201:5000"
    networks:
      - bbt-development
    depends_on:
      - dapr-placement
      - dapr-scheduler
      - postgres
      
  vnext-execution-app:
    container_name: vnext-execution-app
    build:
      context: ../..
      dockerfile: execution/BBT.Workflow.Execution.HttpApi.Host/Dockerfile
      args:
        ENVIRONMENT: stage
    env_file:
      - .env.execution.stage
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 10s
      retries: 5
      start_period: 35s
      timeout: 30s
    ports:
      - "4202:5000"
    networks:
      - bbt-development
    depends_on:
      - dapr-placement
      - dapr-scheduler
      - postgres

  init:
    build:
      context: ../../
      dockerfile: init/VNext.Init.Host/Dockerfile
    container_name: init
    env_file:
      - env.stage
    environment:
      - PACKAGE_API_PORT=3000
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - npm-cache:/app/.npm-cache
    networks:
      - bbt-development
    depends_on:
      - vnext-app
      - redis
      - postgres
    restart: "no"

  vnext-orchestration-dapr:
    image: "daprio/daprd"
    container_name: vnext-orchestration-dapr
    command: [
      "./daprd",
      "--config", "/dapr-config.yaml",
      "--app-id", "vnext-app",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--dapr-grpc-port", "42111",
      "--dapr-http-port", "42110",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "../../etc/orchestration/dapr/components:/components"
      - "../../etc/orchestration/dapr/config.yaml:/dapr-config.yaml"
    network_mode: "service:vnext-app"
    depends_on:
      - vnext-app
      - dapr-placement
      - dapr-scheduler
      - redis
      - vault
        
  vnext-execution-dapr:
    image: "daprio/daprd"
    container_name: vnext-execution-dapr
    command: [
      "./daprd",
      "--config", "/dapr-config.yaml",
      "--app-id", "vnext-execution-app",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--dapr-grpc-port", "43111",
      "--dapr-http-port", "43110",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "../../etc/execution/dapr/components:/components"
      - "../../etc/execution/dapr/config.yaml:/dapr-config.yaml"
    network_mode: "service:vnext-execution-app"
    depends_on:
      - vnext-execution-app
      - dapr-placement
      - dapr-scheduler
      - redis
      - vault

  vnext-monitoring-app:
    container_name: vnext-monitoring-app
    build:
      context: ../..
      dockerfile: monitoring/BBT.Workflow.Monitor.HttpApi.Host/Dockerfile
      args:
        ENVIRONMENT: stage
    env_file:
      - .env.monitoring.stage
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 10s
      retries: 5
      start_period: 35s
      timeout: 30s
    ports:
      - "4203:5000"
    networks:
      - bbt-development
    depends_on:
      - dapr-placement
      - dapr-scheduler
      - postgres

  vnext-monitoring-dapr:
    image: "daprio/daprd"
    container_name: vnext-monitoring-dapr
    command: [
      "./daprd",
      "--config", "/dapr-config.yaml",
      "--app-id", "vnext-monitoring",
      "--app-port", "5000",
      "--resources-path", "./components",
      "--dapr-grpc-port", "42131",
      "--dapr-http-port", "42130",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "../../etc/monitoring/dapr/components:/components"
      - "../../etc/monitoring/dapr/config.yaml:/dapr-config.yaml"
    network_mode: "service:vnext-monitoring-app"
    depends_on:
      - vnext-monitoring-app
      - dapr-placement
      - dapr-scheduler
      - redis
      - vault

  vnext-db-migrator-dapr:
    image: "daprio/daprd"
    container_name: vnext-db-migrator-dapr
    command: [
      "./daprd",
      "--config", "/dapr-config.yaml",
      "--app-id", "vnext-db-migrator",
      "--resources-path", "./components",
      "--dapr-grpc-port", "44211",
      "--dapr-http-port", "44210",
      "--scheduler-host-address", "dapr-scheduler:50007",
      "--placement-host-address", "dapr-placement:50005"
    ]
    volumes:
      - "../../etc/workers/db-migrator/dapr/components:/components"
      - "../../etc/workers/db-migrator/dapr/config.yaml:/dapr-config.yaml"
    ports:
      - "44210:44210"
      - "44211:44211"
    networks:
      - bbt-development
    depends_on:
      - dapr-placement
      - dapr-scheduler
      - redis
      - vault

  vnext-db-migrator:
    container_name: vnext-db-migrator
    build:
      context: ../..
      dockerfile: workers/BBT.Workflow.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=Aether_WorkflowDb;Username=postgres;Password=postgres;"
      DAPR_HTTP_PORT: "44210"
      DAPR_GRPC_PORT: "44211"
      DAPR_LOCK_STORE_NAME: "vnext-lock"
      ASPNETCORE_ENVIRONMENT: "Staging"
    network_mode: "service:vnext-db-migrator-dapr"
    depends_on:
      - vnext-db-migrator-dapr
      - postgres
      - redis
    restart: "no"

  dapr-placement:
    image: "daprio/dapr"
    container_name: dapr-placement
    command: ["./placement"]
    ports:
      - "50005:50005"
    networks:
      - bbt-development

  dapr-scheduler:
    image: "daprio/scheduler"
    container_name: dapr-scheduler
    user: "0:0"
    command: [
      "./scheduler",
      "--port",
      "50007",
      "--etcd-data-dir",
      "/data"
    ]
    ports:
      - "50007:50007"
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: "64m"
          mode: 1777
    networks:
      - bbt-development

  redis:
    container_name: vnext-redis
    image: redis:latest
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis:/data
    networks:
      - bbt-development

  postgres:
    container_name: vnext-postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - bbt-development

  vault:
    container_name: vnext-vault
    image: vault:1.13.3
    restart: on-failure:10
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: 'https://0.0.0.0:8200'
      VAULT_API_ADDR: 'https://0.0.0.0:8200'
      VAULT_DEV_ROOT_TOKEN_ID: 'admin'
      VAULT_TOKEN: 'admin'
    volumes:
      - ./config/vault:/vault/file
    cap_add:
      - IPC_LOCK
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--proxy",
          "off",
          "http://vault:8200/v1/sys/health?standbyok=true",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    command: server -dev -dev-root-token-id="admin"
    networks:
      - bbt-development

  vault-prepopulate:
    image: alpine/curl:latest
    depends_on:
      - vault
    volumes:
      - ./config/vault/vault.sh:/etc/vault/prepopulate_vault.sh
    command: ["sh", "-c", "chmod +x /etc/vault/prepopulate_vault.sh && /etc/vault/prepopulate_vault.sh"]
    networks:
      - bbt-development

  # Elasticsearch — local mirror of the production trace backend. OpenObserve and
  # Elastic APM reconstruct a waterfall differently (Elastic re-parents a span whose
  # parent was never exported), so a trace that looks correct in OpenObserve can look
  # broken in Elastic. Both run side by side here so the two renderings can be compared.
  elasticsearch:
    container_name: vnext-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - bbt-development

  # Kibana — the APM app (Observability > APM > Traces) is the renderer to verify against.
  kibana:
    container_name: vnext-kibana
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.3}
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # Must be at least 32 chars, and stable, or saved objects are re-encrypted on
      # every restart and the APM app loses its state.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "vnext-local-dev-kibana-encryption-key"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bbt-development

  # APM Server — accepts OTLP natively on 8200 (gRPC and HTTP on the same port) and
  # writes Elastic's traces-apm-* / logs-apm-* data streams.
  apm-server:
    container_name: vnext-apm-server
    image: docker.elastic.co/apm/apm-server:${ELASTIC_VERSION:-8.15.3}
    # strict.perms is relaxed because the config file is bind-mounted from the repo and
    # will not be owned by the in-image apm-server user.
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./config/apm/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports:
      # Vault already publishes 8200 on the host, so this is 8201 outside; inside the
      # compose network it still listens on 8200, which is what the collector targets.
      - "8201:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bbt-development

  # OpenObserve for observability
  openobserve:
    container_name: vnext-openobserve
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      ZO_ROOT_USER_EMAIL: "root@example.com"
      ZO_ROOT_USER_PASSWORD: "Complexpass#@123"
      ZO_DATA_DIR: "/data"
    ports:
      - "5080:5080"
    volumes:
      - openobserve:/data
    networks:
      - bbt-development

  # OpenTelemetry Collector
  otel-collector:
    container_name: vnext-otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./config/otel/otel-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "1888:1888" # pprof extension
      - "8888:8888" # Prometheus metrics exposed by the Collector
      - "8889:8889" # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
      - "55679:55679" # zpages extension
    depends_on:
      - openobserve
      - apm-server
    networks:
      - bbt-development

networks:
  bbt-development:
    external: true

volumes:
  redis:
  postgres:
  openobserve:
  elasticsearch:
  vnext-monitoring-app:
  npm-cache: {}
