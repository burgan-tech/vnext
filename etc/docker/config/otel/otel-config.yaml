# Configure receivers
# We only need otlp protocol on grpc, but you can use http, zipkin, jaeger, aws, etc.
# https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Configure exporters
exporters:
  # OpenObserve HTTP endpoint for traces (OTLP exporter adds /v1/traces automatically)
  otlphttp/openobserve-traces:
    endpoint: "http://openobserve:5080/api/default"
    headers:
      Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyNAMTIz"
      stream-name: "vnext"
      organization: default
    tls:
      insecure: true
  
  # OpenObserve HTTP endpoint for metrics (OTLP exporter adds /v1/metrics automatically)
  otlphttp/openobserve-metrics:
    endpoint: "http://openobserve:5080/api/default"
    headers:
      Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyNAMTIz"
      stream-name: "vnext"
      organization: default
    tls:
      insecure: true
  
  # OpenObserve HTTP endpoint for logs (OTLP exporter adds /v1/logs automatically)
  otlphttp/openobserve-logs:
    endpoint: "http://openobserve:5080/api/default"
    headers:
      Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyNAMTIz"
      stream-name: "vnext"
      organization: default
    tls:
      insecure: true

  # Elastic APM Server — OTLP/gRPC on the same 8200 port it serves intake on. Traces,
  # metrics and logs all go here, so Kibana's APM app renders the same data OpenObserve
  # gets. Kept alongside the OpenObserve exporters on purpose: the two backends
  # reconstruct a trace waterfall differently, and comparing them is the point.
  otlp/elastic:
    endpoint: "apm-server:8200"
    tls:
      insecure: true

  # log to the console
  debug:
    verbosity: detailed

# Export to a file
#  file:
#    path: /etc/output/logs.json

# Configure processors (batch, sampling, filtering, hashing sensitive data, etc.)
# https://opentelemetry.io/docs/collector/configuration/#processors
processors:
  batch:

  # Drops the SIDECAR's own span for Dapr gRPC calls, and only the sidecar's.
  #
  # The two span kinds are told apart by the leading slash, which is the gRPC full-method
  # name the sidecar's server span carries:
  #
  #   `dapr.proto.runtime.v1.Dapr/GetState`   — the APP's client span (GrpcNetClient
  #                                             instrumentation), correctly nested under the
  #                                             business span. MUST SURVIVE: it is the only
  #                                             thing that says how long `Cache.Get` or
  #                                             `Lock.Acquire` actually spent on the wire.
  #   `/dapr.proto.runtime.v1.Dapr/GetState`  — the sidecar's server span. Adds only its own
  #                                             handling time, and for state-store and lock
  #                                             calls it arrives ORPHANED.
  #
  # The pattern used to be `^/?dapr…`, and the optional slash made it drop BOTH — including
  # the app-side span this comment has always said must survive. Measured on 2026-09-13: a
  # ten-minute window through this collector contained ZERO spans of either kind, while the
  # same traffic through a collector without this processor contained 254 app-side and 254
  # sidecar GetState spans. The anchor is now `^/` so only the sidecar's are dropped.
  #
  # Why the sidecar's orphan, root cause measured 2026-09-13: Aether's HttpClient
  # instrumentation filter. `AetherTelemetryServiceCollectionExtensions.ShouldTraceHttpRequest`
  # is `IsVerbose || !IsDaprDiagnosticRequest(uri)`, and `IsDaprDiagnosticRequest` lists exactly
  # GetState / GetBulkState / SaveState / DeleteState / ExecuteStateTransaction / GetSecret /
  # GetBulkSecret / GetConfiguration / SubscribeConfiguration / TryLockAlpha1 / UnlockAlpha1.
  # In the default Business profile those HttpClient spans are dropped — but dropping a span
  # does not remove the Activity, and it is that Activity's id which goes into `traceparent`.
  # The sidecar therefore parents its span on an id no backend ever received, and Elastic APM
  # re-roots it (45 -> 173 spans on one transition).
  #
  # The evidence is a clean split. Over 300 sidecar spans, every GetState/SaveState/TryLock/
  # Unlock one was orphaned (248) while every PublishEvent and Jobs one — none of them on that
  # list — had an exported parent (52). Restarting one host with
  # `Telemetry__Tracing__DetailLevel=Verbose` made the four missing HttpClient spans appear
  # immediately (13 GetState, 7 TryLock, 7 Unlock, 2 SaveState) with no other change.
  #
  # It is NOT a missing gRPC client span — that one exists and nests correctly — and it is NOT
  # GrpcNetClient's SuppressDownstreamInstrumentation: setting that to false changed nothing.
  # The fix belongs in Aether; until it lands, this processor is the mitigation.
  #
  # Service-invocation spans (`CallLocal/*`) are deliberately untouched — those are the ones
  # that reconnect orchestration to Execution. Remove this processor once that HttpClient
  # hole is fixed; until then it is dropping 52 spans that would nest correctly, which is
  # the price of one simple rule.
  filter/dapr-internals:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^/dapr\\.proto\\.runtime\\.v1\\.Dapr/")'

# Configure pipelines. Pipeline defines a path the data follows in the Collector
# starting from reception, then further processing or modification and finally
# exiting the Collector via exporters.
# https://opentelemetry.io/docs/collector/configuration/#service
# https://github.com/open-telemetry/opentelemetry-collector/blob/main/docs/design.md#pipelines
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/dapr-internals, batch]
      exporters: [debug, otlphttp/openobserve-traces, otlp/elastic]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/openobserve-metrics, otlp/elastic]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/openobserve-logs, otlp/elastic]
