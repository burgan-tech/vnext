name: Issue Triage

# Enriches issues with a type, labels and a sticky "AI triage" comment.
# The Cursor agent reads the issue snapshot and the code and prints a JSON result; it has no
# shell, write, network or GitHub access. scripts/triage/apply.mjs validates that result against
# .github/triage/labels.json and is the only step that writes to GitHub.
# Runs on issue events; a manual run triages one issue or sweeps untriaged open issues.
# Mode: repository variable TRIAGE_MODE = dry-run (default: comment only) | apply. In apply mode
# the empty milestone, org issue fields (Priority, Effort) and org project are filled from the
# `defaults` block of labels.json; the last two use the GitHub App (APP_ID / APP_PRIVATE_KEY).
# Auth: secret CURSOR_API_KEY (the shared CI Cursor account); without it the job is a no-op.
# Model: repository variable TRIAGE_MODEL overrides the pinned default (`agent --list-models`).

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number (empty = sweep)'
        required: false
      limit:
        description: 'Sweep limit'
        required: false
        default: '20'

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

jobs:
  triage:
    if: github.event_name != 'issues' || !endsWith(github.event.issue.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TRIAGE_MODE: ${{ vars.TRIAGE_MODE || 'dry-run' }}
      TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'claude-sonnet-5-5-medium' }}
      HAS_AUTH: ${{ secrets.CURSOR_API_KEY != '' }}
    steps:
      - name: Check credentials
        if: env.HAS_AUTH != 'true'
        run: echo "::notice::CURSOR_API_KEY not set; issue triage skipped."

      - uses: actions/checkout@v4
        if: env.HAS_AUTH == 'true'
        with:
          # The agent can read the working tree; keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: env.HAS_AUTH == 'true'
        with:
          node-version: '24'

      - name: Run triage script tests
        if: env.HAS_AUTH == 'true'
        run: node --test "scripts/triage/test/*.test.mjs"

      - name: Collect issues
        id: collect
        if: env.HAS_AUTH == 'true'
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          LIMIT: ${{ inputs.limit || '20' }}
        run: |
          if [ -n "$ISSUE" ]; then
            node scripts/triage/collect.mjs --issue "$ISSUE"
          else
            node scripts/triage/collect.mjs --sweep --limit "$LIMIT"
          fi

      - name: Stage trusted tooling
        # apply.mjs and the taxonomy run from this copy, taken before the agent can touch the tree.
        if: env.HAS_AUTH == 'true' && steps.collect.outputs.issues != ''
        run: |
          mkdir -p "$RUNNER_TEMP/triage-tools/scripts" "$RUNNER_TEMP/triage-tools/taxonomy"
          cp -R scripts/triage "$RUNNER_TEMP/triage-tools/scripts/"
          cp .github/triage/labels.json "$RUNNER_TEMP/triage-tools/taxonomy/labels.json"

      - name: Install Cursor CLI
        if: env.HAS_AUTH == 'true' && steps.collect.outputs.issues != ''
        # Pinned package, verified before it runs. To upgrade: read the version from
        # https://cursor.com/install, then `curl -fsSL <url> | shasum -a 256` for the new hash.
        env:
          CURSOR_CLI_VERSION: 2026.10.22-27dcf5f
          CURSOR_CLI_SHA256: 85296944e4600a83c4b764f578d1502bf9c416db200d33a593e8f3ecabfdc294
        run: |
          pkg="$RUNNER_TEMP/cursor-cli.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$pkg" "https://downloads.cursor.com/lab/$CURSOR_CLI_VERSION/linux/x64/agent-cli-package.tar.gz"
          echo "$CURSOR_CLI_SHA256  $pkg" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cursor-cli"
          tar --strip-components=1 -xzf "$pkg" -C "$RUNNER_TEMP/cursor-cli"
          echo "$RUNNER_TEMP/cursor-cli" >> "$GITHUB_PATH"

      - name: Triage with Cursor (read-only)
        if: env.HAS_AUTH == 'true' && steps.collect.outputs.issues != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUES: ${{ steps.collect.outputs.issues }}
        run: |
          mkdir -p .triage/out
          # Global CLI config outside the checkout. The agent gets no --force: every tool that needs
          # approval (shell, writes) is refused in print mode, and the deny list refuses them again
          # together with reads outside the code. The agent prints its result; this step saves it.
          export CURSOR_CONFIG_DIR="$RUNNER_TEMP/cursor-config"
          mkdir -p "$CURSOR_CONFIG_DIR"
          cat > "$CURSOR_CONFIG_DIR/cli-config.json" <<'JSON'
          {
            "version": 1,
            "editor": { "vimMode": false },
            "permissions": {
              "allow": ["Read(**)"],
              "deny": [
                "Shell(*)", "Write(**)", "Write(/**)", "WebFetch(*)", "Mcp(*:*)",
                "Read(.git/**)", "Read(.triage/out/**)",
                "Read(/proc/**)", "Read(/sys/**)", "Read(/etc/**)", "Read(/root/**)",
                "Read(/tmp/**)", "Read(/opt/**)", "Read(/usr/**)", "Read(/var/**)",
                "Read(/home/runner/.cursor/**)", "Read(/home/runner/.config/**)", "Read(/home/runner/.ssh/**)",
                "Read(/home/runner/.docker/**)", "Read(/home/runner/.npm/**)", "Read(/home/runner/.npmrc)",
                "Read(/home/runner/.gitconfig)",
                "Read(/home/runner/work/_temp/**)", "Read(/home/runner/work/_actions/**)"
              ]
            }
          }
          JSON
          for n in $ISSUES; do
            echo "::group::Issue #$n"
            timeout 900 cursor-agent -p --trust --mode ask --output-format json --model "$TRIAGE_MODEL" \
              "Follow .github/triage/TRIAGE.md for the single input file .triage/in/$n.json. Answer with the result JSON object only." \
              > ".triage/out/$n.json" \
              || echo "::warning::Cursor agent exited non-zero on #$n"
            echo "::endgroup::"
          done

      - name: Check the agent left the tree untouched
        if: env.HAS_AUTH == 'true' && steps.collect.outputs.issues != ''
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::The triage agent changed files outside .triage/; nothing is written to GitHub."
            echo "$dirty"
            exit 1
          fi

      - name: Generate GitHub App token
        # Org issue fields and the org project need an installation token with Issues and
        # Organization projects (read and write); GITHUB_TOKEN cannot reach org projects.
        # Taken after the agent ran, so the agent never has it.
        id: app
        if: env.HAS_AUTH == 'true' && steps.collect.outputs.issues != '' && env.TRIAGE_MODE == 'apply'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Apply results
        if: env.HAS_AUTH == 'true' && steps.collect.outputs.issues != ''
        env:
          TRIAGE_APP_TOKEN: ${{ steps.app.outputs.token }}
          TRIAGE_REDACT: |
            ${{ secrets.CURSOR_API_KEY }}
            ${{ github.token }}
            ${{ steps.app.outputs.token }}
        run: |
          node "$RUNNER_TEMP/triage-tools/scripts/triage/apply.mjs" \
            --mode "$TRIAGE_MODE" \
            --taxonomy "$RUNNER_TEMP/triage-tools/taxonomy/labels.json"
