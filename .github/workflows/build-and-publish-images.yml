name: Build and Publish Docker Images

on:
  push:
    branches:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.80). Pins the version instead of walking to the next free patch — use with force_publish to re-publish a shipped release whose packages failed.'
        required: false
        type: string
      force_publish:
        description: 'Force publish images even if they exist'
        required: false
        default: false
        type: boolean
      schema_version:
        description: 'Overrides the vnext-schema version written to the manifest row (X.Y.Z); default = highest of the previous row and the fragments'
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}
  EXECUTION_IMAGE_NAME: ${{ github.repository }}/execution
  PYTHON_RUNNER_IMAGE_NAME: ${{ github.repository }}/python-runner
  ORCHESTRATOR_IMAGE_NAME: ${{ github.repository }}/orchestrator
  INIT_IMAGE_NAME: ${{ github.repository }}/init
  INBOX_IMAGE_NAME: ${{ github.repository }}/inbox
  OUTBOX_IMAGE_NAME: ${{ github.repository }}/outbox
  DBMIGRATOR_IMAGE_NAME: ${{ github.repository }}/db-migrator
  MCP_SERVER_IMAGE_NAME: ${{ github.repository }}/mcp-server

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.stamp.outputs.release_sha }}
      release_line: ${{ steps.line.outputs.release_line }}
      is_latest: ${{ steps.line.outputs.is_latest }}
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            vnext
            vnext-helm-charts

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Calculate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            # Re-publish an EXACT stable version. The branch path below deliberately walks to the
            # first unused patch, so it can never target a version that already shipped — which is
            # exactly what is needed when a release succeeded but one publish job failed (e.g. the
            # NuGet push), leaving images and packages on different versions. Pinning the version
            # here lets that release be completed instead of skipped.
            echo "Pinned stable version requested via workflow_dispatch"

            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: 'version' must match X.Y.Z (got: $INPUT_VERSION)"
              exit 1
            fi

            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"

            # Re-publishing over a shipped tag is intentional here, but never implicit.
            if git tag -l "$TAG" | grep -q "^$TAG$"; then
              if [[ "$INPUT_FORCE_PUBLISH" == "true" ]]; then
                echo "Warning: Tag $TAG already exists but force_publish=true, re-publishing it"
              else
                echo "Error: Tag $TAG already exists. Set force_publish=true to re-publish this version."
                exit 1
              fi
            fi

            echo "Resolved pinned version: $VERSION"
          elif [[ "$BRANCH_NAME" =~ ^release-v([0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            echo "Base version from branch: $BASE_VERSION"

            PATCH=0
            while true; do
              VERSION="${BASE_VERSION}.${PATCH}"
              TAG="v${VERSION}"

              if git tag -l "$TAG" | grep -q "^$TAG$"; then
                echo "Version $VERSION already exists, trying next patch version..."
                PATCH=$((PATCH + 1))
              else
                echo "Found available version: $VERSION"
                break
              fi

              if [ $PATCH -gt 100 ]; then
                echo "Error: Could not find available patch version after 100 attempts"
                exit 1
              fi
            done
          else
            echo "Branch name doesn't match release-vX.Y pattern, using version from common.props"
            VERSION=$(grep '<Version>' ./common.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | head -n 1)

            if [ -z "$VERSION" ]; then
              echo "Error: Could not determine version"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      # Parallel release lines (docs/governance/release-lines.md): an older line (e.g. 1.1.9) may ship
      # after a newer one (1.2.0). Every `latest` channel (Docker tag, npm dist-tag, GitHub "latest"
      # release, helm chart) only moves when this version is >= the highest stable tag, so it never
      # goes backwards. Re-publishing the highest version compares equal and stays latest.
      - name: Resolve release line and latest flag
        id: line
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          RELEASE_LINE="release-v${MAJOR_MINOR}"

          HIGHEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)

          if [ -z "$HIGHEST" ]; then
            IS_LATEST=true
          elif [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            IS_LATEST=true
          else
            IS_LATEST=false
          fi

          echo "release_line=$RELEASE_LINE" >> "$GITHUB_OUTPUT"
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
          echo "Release line: $RELEASE_LINE; highest stable tag: ${HIGHEST:-none}; is_latest=$IS_LATEST"

      - name: Bump version, stamp vnext-meta and commit
        id: stamp
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SCHEMA_VERSION: ${{ inputs.schema_version }}
        run: |
          # Pull latest remote state to avoid non-fast-forward on re-runs
          git pull --rebase origin "$REF_NAME"

          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|g" ./common.props
          echo "Updated common.props with version $VERSION"

          # Lint twice: before the stamp (it consumes and deletes the fragments, so only now can their
          # rules be checked) and after it (the stamped result).
          if ! node scripts/governance/meta-lint.mjs --milestone "v$VERSION"; then
            echo "::error::vnext-meta lint failed before stamping $VERSION; nothing was committed or published."
            exit 1
          fi

          node scripts/governance/meta-stamp.mjs --version "$VERSION" --date "$(date -u +%F)" \
            ${SCHEMA_VERSION:+--schema-version "$SCHEMA_VERSION"} \
            --notes-out "$RUNNER_TEMP/release-notes.json"

          # Fail before any commit: nothing is pushed and every downstream job (all need prepare) is skipped.
          if ! node scripts/governance/meta-lint.mjs --milestone "v$VERSION"; then
            echo "::error::vnext-meta lint failed after stamping $VERSION; nothing was committed or published."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add common.props vnext-meta
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION and stamp vnext-meta [skip ci]"
            git push origin "$REF_NAME"
            echo "Committed and pushed version bump and vnext-meta stamp"
          else
            echo "No changes (already at version $VERSION and stamped)"
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release-notes.json
          if-no-files-found: ignore

  build-sign-scan:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: execution
            image: execution
            image_name_env: EXECUTION_IMAGE_NAME
            dockerfile: ./execution/BBT.Workflow.Execution.HttpApi.Host/Dockerfile
            with_version_arg: true
          - key: python-runner
            image: python-runner
            image_name_env: PYTHON_RUNNER_IMAGE_NAME
            dockerfile: ./execution/python/Dockerfile
            with_version_arg: false
          - key: orchestrator
            image: orchestrator
            image_name_env: ORCHESTRATOR_IMAGE_NAME
            dockerfile: ./orchestration/BBT.Workflow.Orchestration.HttpApi.Host/Dockerfile
            with_version_arg: true
          - key: init
            image: init
            image_name_env: INIT_IMAGE_NAME
            dockerfile: ./init/VNext.Init.Host/Dockerfile
            with_version_arg: false
          - key: inbox
            image: inbox
            image_name_env: INBOX_IMAGE_NAME
            dockerfile: ./workers/BBT.Workflow.Workers.Inbox/Dockerfile
            with_version_arg: true
          - key: outbox
            image: outbox
            image_name_env: OUTBOX_IMAGE_NAME
            dockerfile: ./workers/BBT.Workflow.Workers.Outbox/Dockerfile
            with_version_arg: true
          - key: db-migrator
            image: db-migrator
            image_name_env: DBMIGRATOR_IMAGE_NAME
            dockerfile: ./workers/BBT.Workflow.DbMigrator/Dockerfile
            with_version_arg: false
          - key: mcp-server
            image: mcp-server
            image_name_env: MCP_SERVER_IMAGE_NAME
            dockerfile: ./tools/BBT.Workflow.Mcp.Server/Dockerfile
            with_version_arg: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stamp version into common.props
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|g" ./common.props
          echo "Stamped common.props with version $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.2xx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_latest == 'true' }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image (with VERSION build-arg)
        id: push_with_version
        if: matrix.with_version_arg
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}

      - name: Build and push Docker image
        id: push_without_version
        if: ${{ !matrix.with_version_arg }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image digest
        id: digest
        run: |
          DIGEST="${{ steps.push_with_version.outputs.digest || steps.push_without_version.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "Error: Could not resolve image digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Resolved digest: $DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest (immutable reference)
        env:
          IMAGE_REF: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          format: spdx-json
          output-file: ${{ matrix.key }}-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.key }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.key }}-sbom.spdx.json
          retention-days: 90

      # v3 bundles grype 0.74, whose vulnerability-DB feed is discontinued — it fails
      # with "db was built N weeks ago" and produces no SARIF, so scans were silently
      # empty (the validate-SARIF guard below was masking exactly this).
      - name: Security scan
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          fail-build: false
          output-format: sarif

      - name: Validate SARIF output
        id: validate_sarif
        if: always() && steps.scan.outputs.sarif != ''
        run: |
          SARIF_FILE="${{ steps.scan.outputs.sarif }}"
          if [ -f "$SARIF_FILE" ] && [ -s "$SARIF_FILE" ] && jq empty "$SARIF_FILE" 2>/dev/null; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::SARIF file is missing, empty, or contains invalid JSON – skipping upload"
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload SARIF results
        if: always() && steps.validate_sarif.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ matrix.key }}

      - name: Write digest file
        run: |
          mkdir -p digests
          echo "${{ steps.digest.outputs.digest }}" > digests/${{ matrix.key }}.digest

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.key }}
          path: digests/${{ matrix.key }}.digest
          retention-days: 90

  release:
    needs: [prepare, build-sign-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            vnext
            vnext-helm-charts

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Export digests as env
        id: digests
        run: |
          EXEC_DIGEST=$(cat digests/execution.digest)
          PYTHON_RUNNER_DIGEST=$(cat digests/python-runner.digest)
          ORCH_DIGEST=$(cat digests/orchestrator.digest)
          INIT_DIGEST=$(cat digests/init.digest)
          INBOX_DIGEST=$(cat digests/inbox.digest)
          OUTBOX_DIGEST=$(cat digests/outbox.digest)
          DBMIG_DIGEST=$(cat digests/db-migrator.digest)

          echo "exec_digest=$EXEC_DIGEST" >> $GITHUB_OUTPUT
          echo "python_runner_digest=$PYTHON_RUNNER_DIGEST" >> $GITHUB_OUTPUT
          echo "orch_digest=$ORCH_DIGEST" >> $GITHUB_OUTPUT
          echo "init_digest=$INIT_DIGEST" >> $GITHUB_OUTPUT
          echo "inbox_digest=$INBOX_DIGEST" >> $GITHUB_OUTPUT
          echo "outbox_digest=$OUTBOX_DIGEST" >> $GITHUB_OUTPUT
          echo "dbmig_digest=$DBMIG_DIGEST" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
          else
            git tag -a "$TAG" -m "Release $TAG - Docker images published"
            git push origin "$TAG"
          fi

      - name: Generate changelog
        env:
          IS_LATEST: ${{ needs.prepare.outputs.is_latest }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REGISTRY="${{ env.REGISTRY }}"
          REPO="${{ github.repository }}"
          WORKFLOW_REF="https://github.com/${REPO}/.github/workflows/build-and-publish-images.yml@.*"

          EXEC_DIGEST="${{ steps.digests.outputs.exec_digest }}"
          PYTHON_RUNNER_DIGEST="${{ steps.digests.outputs.python_runner_digest }}"
          ORCH_DIGEST="${{ steps.digests.outputs.orch_digest }}"
          INIT_DIGEST="${{ steps.digests.outputs.init_digest }}"
          INBOX_DIGEST="${{ steps.digests.outputs.inbox_digest }}"
          OUTBOX_DIGEST="${{ steps.digests.outputs.outbox_digest }}"
          DBMIG_DIGEST="${{ steps.digests.outputs.dbmig_digest }}"

          # The `latest` tag exists only for the latest release; an older line lists just its own tags.
          LATEST_TAG_LINE=""
          if [ "$IS_LATEST" = "true" ]; then
            LATEST_TAG_LINE=$'\n'"- \`latest\` - Latest stable release"
          fi

          cat > changelog.md <<EOF
          ## BBT Workflow v${VERSION}

          ### 🐳 Published Docker Images

          #### Immutable digests (preferred for trust)

          Tags can move; these digests cannot. Signatures and provenance refer to these references.

          - \`${REGISTRY}/${REPO}/execution@${EXEC_DIGEST}\`
          - \`${REGISTRY}/${REPO}/python-runner@${PYTHON_RUNNER_DIGEST}\`
          - \`${REGISTRY}/${REPO}/orchestrator@${ORCH_DIGEST}\`
          - \`${REGISTRY}/${REPO}/init@${INIT_DIGEST}\`
          - \`${REGISTRY}/${REPO}/inbox@${INBOX_DIGEST}\`
          - \`${REGISTRY}/${REPO}/outbox@${OUTBOX_DIGEST}\`
          - \`${REGISTRY}/${REPO}/db-migrator@${DBMIG_DIGEST}\`

          #### Tags (mutable, convenience)

          \`\`\`bash
          docker pull ${REGISTRY}/${REPO}/execution:${VERSION}
          docker pull ${REGISTRY}/${REPO}/python-runner:${VERSION}
          docker pull ${REGISTRY}/${REPO}/orchestrator:${VERSION}
          docker pull ${REGISTRY}/${REPO}/init:${VERSION}
          docker pull ${REGISTRY}/${REPO}/inbox:${VERSION}
          docker pull ${REGISTRY}/${REPO}/outbox:${VERSION}
          docker pull ${REGISTRY}/${REPO}/db-migrator:${VERSION}
          \`\`\`

          ### 🔐 Supply Chain

          - **OCI provenance & SBOM**: pushed with the image (BuildKit \`provenance: mode=max\`, \`sbom: true\`).
          - **GitHub build provenance**: artifact attestation for this workflow run (identity, repo, workflow ref).
          - **Cosign signature**: each image signed by digest with keyless OIDC.

          #### Verify Cosign signature (digest)

          \`\`\`bash
          # Execution
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/execution@${EXEC_DIGEST}

          # Orchestrator
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/orchestrator@${ORCH_DIGEST}

          # Python runner
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/python-runner@${PYTHON_RUNNER_DIGEST}

          # Init
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/init@${INIT_DIGEST}

          # Inbox
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/inbox@${INBOX_DIGEST}

          # Outbox
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/outbox@${OUTBOX_DIGEST}

          # DbMigrator
          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "${WORKFLOW_REF}" \\
            ${REGISTRY}/${REPO}/db-migrator@${DBMIG_DIGEST}
          \`\`\`

          #### Verify GitHub build provenance attestation

          \`\`\`bash
          gh attestation verify oci://${REGISTRY}/${REPO}/execution@${EXEC_DIGEST}    --repo ${REPO}
          gh attestation verify oci://${REGISTRY}/${REPO}/python-runner@${PYTHON_RUNNER_DIGEST} --repo ${REPO}
          gh attestation verify oci://${REGISTRY}/${REPO}/orchestrator@${ORCH_DIGEST}  --repo ${REPO}
          gh attestation verify oci://${REGISTRY}/${REPO}/init@${INIT_DIGEST}          --repo ${REPO}
          gh attestation verify oci://${REGISTRY}/${REPO}/inbox@${INBOX_DIGEST}        --repo ${REPO}
          gh attestation verify oci://${REGISTRY}/${REPO}/outbox@${OUTBOX_DIGEST}      --repo ${REPO}
          gh attestation verify oci://${REGISTRY}/${REPO}/db-migrator@${DBMIG_DIGEST}  --repo ${REPO}
          \`\`\`

          ### 🚀 Quick Start

          **Using Docker Compose:**

          \`\`\`yaml
          version: '3.8'
          services:
            execution:
              image: ${REGISTRY}/${REPO}/execution:${VERSION}
              ports:
                - "5001:5000"
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
            orchestrator:
              image: ${REGISTRY}/${REPO}/orchestrator:${VERSION}
              ports:
                - "5002:5000"
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
              depends_on:
                - execution
            init:
              image: ${REGISTRY}/${REPO}/init:${VERSION}
              ports:
                - "3005:3000"
              environment:
                - VNEXT_APP_URL=http://vnext-app:4201
                - PACKAGE_API_PORT=3005
                - DEFAULT_REGISTRY=https://registry.npmjs.org/
              depends_on:
                - orchestrator
            inbox:
              image: ${REGISTRY}/${REPO}/inbox:${VERSION}
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
              depends_on:
                - orchestrator
            outbox:
              image: ${REGISTRY}/${REPO}/outbox:${VERSION}
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
              depends_on:
                - orchestrator
          \`\`\`

          ### 🏷️ Available Tags

          - \`v${VERSION}\` - This release${LATEST_TAG_LINE}
          - \`${{ github.ref_name }}\` - Branch-specific build

          ---
          *🤖 Built from branch: \`${{ github.ref_name }}\`*
          *📝 Commit: ${{ github.sha }}*
          *⏰ Build run: ${{ github.run_number }}*
          EOF

      # make_latest: an older line's release must not take GitHub's "Latest" badge from a newer one.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: ${{ needs.prepare.outputs.is_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Helm writes appVersion from the payload unconditionally, so a non-latest (older line) release would
  # roll the chart back: skip it. is_latest / release_line ride along for a future line-aware chart.
  trigger-helm:
    needs: [prepare, build-sign-scan, release]
    if: needs.prepare.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Python runner digest
        uses: actions/download-artifact@v4
        with:
          name: digest-python-runner
          path: digests

      - name: Read Python runner digest
        id: python_runner
        run: echo "digest=$(cat digests/python-runner.digest)" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            vnext
            vnext-helm-charts

      - name: Trigger Helm Chart Release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repository: burgan-tech/vnext-helm-charts
          event-type: app-release
          client-payload: '{"app_version": "${{ needs.prepare.outputs.version }}", "python_runner_image": "ghcr.io/${{ github.repository }}/python-runner", "python_runner_digest": "${{ steps.python_runner.outputs.digest }}", "is_latest": "${{ needs.prepare.outputs.is_latest }}", "release_line": "${{ needs.prepare.outputs.release_line }}"}'

  notify:
    needs: [prepare, build-sign-scan, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download digest artifacts
        if: needs.build-sign-scan.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Write deployment summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REGISTRY="${{ env.REGISTRY }}"
          REPO="${{ github.repository }}"

          EXEC_DIGEST=$(cat digests/execution.digest 2>/dev/null || echo "n/a")
          PYTHON_RUNNER_DIGEST=$(cat digests/python-runner.digest 2>/dev/null || echo "n/a")
          ORCH_DIGEST=$(cat digests/orchestrator.digest 2>/dev/null || echo "n/a")
          INIT_DIGEST=$(cat digests/init.digest 2>/dev/null || echo "n/a")
          INBOX_DIGEST=$(cat digests/inbox.digest 2>/dev/null || echo "n/a")
          OUTBOX_DIGEST=$(cat digests/outbox.digest 2>/dev/null || echo "n/a")
          DBMIG_DIGEST=$(cat digests/db-migrator.digest 2>/dev/null || echo "n/a")

          {
            echo "## 🐳 Docker Images Published"
            echo ""
            echo "### 📦 Release Info"
            echo "- **Version**: ${VERSION}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Registry**: ${REGISTRY}"
            echo ""
            echo "### 🔐 Immutable Image Digests (cosign-signed)"
            echo ""
            echo "| Image | Digest |"
            echo "|-------|--------|"
            echo "| execution    | \`${EXEC_DIGEST}\`  |"
            echo "| python-runner| \`${PYTHON_RUNNER_DIGEST}\` |"
            echo "| orchestrator | \`${ORCH_DIGEST}\`  |"
            echo "| init         | \`${INIT_DIGEST}\`  |"
            echo "| inbox        | \`${INBOX_DIGEST}\` |"
            echo "| outbox       | \`${OUTBOX_DIGEST}\`|"
            echo "| db-migrator  | \`${DBMIG_DIGEST}\` |"
            echo ""
            echo "### 🏷️ Mutable Tags"
            echo ""
            echo '```bash'
            echo "docker pull ${REGISTRY}/${REPO}/execution:${VERSION}"
            echo "docker pull ${REGISTRY}/${REPO}/python-runner:${VERSION}"
            echo "docker pull ${REGISTRY}/${REPO}/orchestrator:${VERSION}"
            echo "docker pull ${REGISTRY}/${REPO}/init:${VERSION}"
            echo "docker pull ${REGISTRY}/${REPO}/inbox:${VERSION}"
            echo "docker pull ${REGISTRY}/${REPO}/outbox:${VERSION}"
            echo "docker pull ${REGISTRY}/${REPO}/db-migrator:${VERSION}"
            echo '```'
            echo ""
            echo "### 🎯 Next Steps"
            echo "1. 🐳 Images are available in GitHub Container Registry"
            echo "2. 🏷️ Git tag v${VERSION} has been created"
            echo "3. 📋 GitHub release published with cosign verify commands"
            echo "4. 🔒 Cosign signatures, SBOMs and provenance attestations generated"
          } >> $GITHUB_STEP_SUMMARY

  # The latest line returns its stamped vnext-meta to master by the usual back-merge. An older line
  # (not latest) must not be back-merged, so its meta (manifest rows, stamped entries, fragment record)
  # comes back through a PR built by meta-sync. See docs/governance/release-lines.md.
  # The PR is opened with the App token so the PR Contract workflow runs on it.
  sync-meta-to-master:
    needs: [prepare, release]
    if: needs.prepare.outputs.is_latest != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            vnext

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      # After the master checkout: a later checkout at the workspace root would clean this directory away.
      - name: Checkout the stamped release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: release-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync vnext-meta into master
        id: sync
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/governance/meta-sync.mjs --source release-src/vnext-meta --target vnext-meta \
            | tee "$RUNNER_TEMP/meta-sync.txt"

          # Errors fail the job; warnings (e.g. META-FRAGMENT-RELEASED leftovers) are expected and fine.
          if ! node scripts/governance/meta-lint.mjs; then
            echo "::error::vnext-meta lint failed on master after syncing v$VERSION; no PR was opened."
            exit 1
          fi

          if [ -z "$(git status --porcelain vnext-meta)" ]; then
            echo "::notice::master's vnext-meta already holds v$VERSION; no sync PR needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ADDED=$(sed -n 's/^added versions ([0-9]*): //p' "$RUNNER_TEMP/meta-sync.txt")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "added_versions=${ADDED:-none}" >> "$GITHUB_OUTPUT"
          git status --short vnext-meta

      - name: Push the sync branch and open the PR
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ADDED_VERSIONS: ${{ steps.sync.outputs.added_versions }}
          RELEASE_LINE: ${{ needs.prepare.outputs.release_line }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="meta-sync/v$VERSION"
          TITLE="chore(meta): sync vnext-meta for v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add vnext-meta
          git commit -m "$TITLE"
          # Force: a re-run rebuilds the branch from the current master; an open PR follows the push.
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "::notice::An open PR for $BRANCH already exists; the push updated it."
            exit 0
          fi

          cat > "$RUNNER_TEMP/meta-sync-pr.md" <<EOF
          ## Summary

          Brings the vnext-meta stamped by the \`$RELEASE_LINE\` release **v$VERSION** back to master.
          That line is not the latest, so it is not back-merged; this PR carries its meta instead.

          - Added manifest versions: $ADDED_VERSIONS
          - Built by \`scripts/governance/meta-sync.mjs\` (lower version wins for an id both sides hold).

          Process: [docs/governance/release-lines.md]($SERVER_URL/$REPO/blob/master/docs/governance/release-lines.md)
          EOF

          gh pr create --base master --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/meta-sync-pr.md"

  publish-nuget:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      # NuGet trusted publishing: the job's OIDC token is exchanged for a
      # short-lived API key, so no long-lived secret is involved.
      id-token: write

    env:
      NUGET_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x (latest 10.0 SDK) is installed alongside the 10.0.2xx band so
          # the AspNetCore.App shared framework matching the runner's system
          # runtime (e.g. 10.0.9) is present. PostSharp rolls its host forward to
          # that runtime and requires the matching AspNetCore.App or it fails with
          # "No compatible version of requested runtime framework Microsoft.AspNetCore.App".
          dotnet-version: |
            9.0.x
            10.0.2xx
            10.0.x

      - name: Setup NETStandard.Library.Ref for PostSharp
        run: ./scripts/setup-netstandard-ref.sh

      - name: Restore solution
        run: dotnet restore ./BBT.Workflow.slnx --verbosity normal

      # Pack order follows the dependency chain:
      # Events.Contracts (leaf) → Modules.Scripting (leaf) → Domain → Tasks.Abstractions
      - name: Pack BBT.Workflow.Events.Contracts
        run: |
          dotnet pack src/BBT.Workflow.Events.Contracts/BBT.Workflow.Events.Contracts.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ env.NUGET_VERSION }} \
            --output ./nuget-artifacts

      - name: Pack BBT.Workflow.Modules.Scripting
        run: |
          dotnet pack modules/BBT.Workflow.Modules.Scripting/BBT.Workflow.Modules.Scripting.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ env.NUGET_VERSION }} \
            --output ./nuget-artifacts

      - name: Pack BBT.Workflow.Domain
        run: |
          dotnet pack src/BBT.Workflow.Domain/BBT.Workflow.Domain.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ env.NUGET_VERSION }} \
            --output ./nuget-artifacts

      - name: Pack BBT.Workflow.Tasks.Abstractions
        run: |
          dotnet pack src/BBT.Workflow.Tasks.Abstractions/BBT.Workflow.Tasks.Abstractions.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ env.NUGET_VERSION }} \
            --output ./nuget-artifacts

      # dotnet tool: installs as `vnext-mcp` (stdio MCP server for local AI tooling).
      - name: Pack BBT.Workflow.Mcp (dotnet tool)
        run: |
          dotnet pack tools/BBT.Workflow.Mcp.Server/BBT.Workflow.Mcp.Server.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ env.NUGET_VERSION }} \
            --output ./nuget-artifacts

      # An undefined secret is silently the empty string, which would surface as an
      # opaque token-exchange failure below. Read through env rather than inlining the
      # expression, so the value stays masked and cannot be interpolated into the script.
      - name: Verify NuGet trusted publishing is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository secret NUGET_USER is not set. It must hold the nuget.org username that owns the trusted publishing policy for burgan-tech/vnext."
            exit 1
          fi

      # Trusted publishing: exchange this workflow's OIDC token for a NuGet API key
      # valid for one hour. Kept directly before the push — the pack steps above are
      # slow (PostSharp), and nuget.org matches the policy on repository owner,
      # repository and this workflow's file name, not on a branch or a stored secret.
      - name: Log in to NuGet.org (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push all packages to NuGet.org
        run: |
          dotnet nuget push ./nuget-artifacts/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Notify NuGet publish status
        run: |
          echo "## 📦 NuGet Packages Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${{ env.NUGET_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | NuGet |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| BBT.Workflow.Events.Contracts | [nuget.org](https://www.nuget.org/packages/BBT.Workflow.Events.Contracts) |" >> $GITHUB_STEP_SUMMARY
          # PackageId, not the project name: modules/BBT.Workflow.Modules.Scripting packs as
          # BBT.Workflow.Scripting, and the old link pointed at an id that does not exist on
          # nuget.org — every release summary carried a dead link.
          echo "| BBT.Workflow.Scripting | [nuget.org](https://www.nuget.org/packages/BBT.Workflow.Scripting) |" >> $GITHUB_STEP_SUMMARY
          echo "| BBT.Workflow.Domain | [nuget.org](https://www.nuget.org/packages/BBT.Workflow.Domain) |" >> $GITHUB_STEP_SUMMARY
          echo "| BBT.Workflow.Tasks.Abstractions | [nuget.org](https://www.nuget.org/packages/BBT.Workflow.Tasks.Abstractions) |" >> $GITHUB_STEP_SUMMARY
          echo "| BBT.Workflow.Mcp (dotnet tool: \`vnext-mcp\`) | [nuget.org](https://www.nuget.org/packages/BBT.Workflow.Mcp) |" >> $GITHUB_STEP_SUMMARY

  publish-npm:
    name: Publish npm Package
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vnext-meta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The trigger SHA still holds the unstamped vnext-meta; the stamp lives in prepare's bot commit.
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          always-auth: false
          cache: 'npm'
          # setup-node runs from the repo root, but the lockfile lives in
          # vnext-meta, so point caching at it explicitly.
          cache-dependency-path: vnext-meta/package-lock.json

      - name: Set package version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      # An older line's release takes its line tag (release-vX.Y) so `latest` never moves backwards.
      - name: Determine npm dist-tag
        id: dist_tag
        env:
          IS_LATEST: ${{ needs.prepare.outputs.is_latest }}
          RELEASE_LINE: ${{ needs.prepare.outputs.release_line }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-rc"* ]]; then
            echo "tag=rc" >> $GITHUB_OUTPUT
          elif [[ "$IS_LATEST" == "true" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$RELEASE_LINE" >> $GITHUB_OUTPUT
          fi

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify npm version
        run: npm -v

      # `npm publish` fails hard on an already-published version and has no equivalent of
      # `dotnet nuget push --skip-duplicate`. That turns a re-publish run — the one used to complete
      # a release whose package step failed — into a red workflow even though nothing is wrong and
      # nothing is missing. Check first, and skip rather than fail.
      - name: Check whether this version is already on npm
        id: npm_exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.prepare.outputs.version }}"

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::${NAME}@${VERSION} is already published on npm; skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "${NAME}@${VERSION} is not on npm yet; publishing."
          fi

      - name: Publish to npm (OIDC)
        if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.tag }}
